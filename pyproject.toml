[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netan"
version = "2.01"
description = "Network builder for multi-omics matrices."
readme = "README.md"
authors = [{name = "Boris Minasenko"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "networkx>=3.0",
  "scikit-learn>=1.2",
  "plotly<=5.0",
  "rodin>=1.9.10",
  "joblib>=1.2",
  "tqdm>=4.65",
  "anywidget",
]

[project.urls]
Homepage = "https://github.com/BM-Boris/netan"
